# =============================================================================
# GitHub Actions CI — ABC-CYB-101 Cybersecurity Lab
# =============================================================================
# Triggers: push/PR to feature/cyb-101-labs and main
# Matrix: 26 units (23 with tests, 3 skipped for no test.sh)
# Fail-fast: CORE units (9 units, 85 retos)
# Report: PASS/FAIL per unit + reto counts (243 total / 85 CORE)
# =============================================================================

name: Lab CI — ABC-CYB-101

on:
  push:
    branches: [feature/cyb-101-labs, main]
  pull_request:
    branches: [feature/cyb-101-labs, main]

# =============================================================================
# Build & Verify
# =============================================================================
jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t lab-ciberseguridad .

      - name: Lint shared scripts (bash -n)
        run: |
          FAILED=0
          for f in shared/*.sh; do
            echo "Checking $f..."
            if ! bash -n "$f"; then
              echo "::error::Syntax error in $f"
              FAILED=1
            fi
          done
          [ "$FAILED" -eq 0 ] && echo "All shared scripts pass syntax check" || exit 1

      - name: Verify build integrity
        run: docker run --rm lab-ciberseguridad bash verify.sh

  # =============================================================================
  # CORE Tests — fail-fast on first failure
  # =============================================================================
  test-core:
    runs-on: ubuntu-latest
    needs: build-and-verify
    strategy:
      fail-fast: true
      matrix:
        unit:
          - i
          - ii-firewalls-redes
          - iii-iam-mfa
          - iv-criptografia-cvss
          - v-logging-siem-bcp
          - vii
          - i-risk-assessment
          - i-asset-classification
          - iii-compliance-iso27001

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t lab-ciberseguridad .

      - name: Test ${{ matrix.unit }} (CORE)
        run: |
          if [ ! -f "units/${{ matrix.unit }}/test.sh" ]; then
            echo "::warning::Unit ${{ matrix.unit }} has no test.sh — skipped"
            exit 0
          fi
          echo "::group::Running CORE unit: ${{ matrix.unit }}"
          if bash "units/${{ matrix.unit }}/test.sh"; then
            echo "::endgroup::"
            echo "PASS: ${{ matrix.unit }} (CORE)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::endgroup::"
            echo "FAIL: ${{ matrix.unit }} (CORE)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  # =============================================================================
  # OPT Tests — non-blocking (continue-on-error)
  # =============================================================================
  test-opt:
    runs-on: ubuntu-latest
    needs: build-and-verify
    strategy:
      fail-fast: false
      matrix:
        unit:
          - ii-ids-intrusion-detection
          - ii
          - iii
          - iv
          - v
          - vi
          - viii
          - ix
          - x
          - xi
          - checkpoint-ii
          - checkpoint-iv
          - checkpoint-v
          - ii-arquitectura-perimetral
          - iv-malware-sandbox
          - iv-lab-integrador
          - iv-burp-intercept

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t lab-ciberseguridad .

      - name: Test ${{ matrix.unit }} (OPT)
        continue-on-error: true
        run: |
          if [ ! -f "units/${{ matrix.unit }}/test.sh" ]; then
            echo "::warning::Unit ${{ matrix.unit }} has no test.sh — skipped"
            exit 0
          fi
          if bash "units/${{ matrix.unit }}/test.sh"; then
            echo "PASS: ${{ matrix.unit }} (OPT)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "FAIL: ${{ matrix.unit }} (OPT) — non-blocking" >> "$GITHUB_STEP_SUMMARY"
          fi

  # =============================================================================
  # Report — PASS/FAIL summary with reto counts
  # =============================================================================
  report:
    runs-on: ubuntu-latest
    needs: [test-core, test-opt]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Generate CI Report
        run: |
          echo "# Lab CI Report — ABC-CYB-101" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Metric | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Total units | 26 |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Units with tests | 23 |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Units skipped (no test.sh) | 3 |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Total retos | 243 |" >> "$GITHUB_STEP_SUMMARY"
          echo "| CORE retos | 85 |" >> "$GITHUB_STEP_SUMMARY"
          echo "| OPT retos | 158 |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ needs.test-core.result }}" = "success" ]; then
            echo "✅ **CORE tests**: ALL PASSED (9/9)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ **CORE tests**: FAILED" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ needs.test-opt.result }}" = "success" ]; then
            echo "✅ **OPT tests**: ALL PASSED (17/17)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⚠️ **OPT tests**: SOME FAILED (non-blocking)" >> "$GITHUB_STEP_SUMMARY"
          fi
