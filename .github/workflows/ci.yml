name: Lab CI

on:
  push:
    branches: [phase1/shared-library, main, fix/shared-lib-bugs]
  pull_request:
    branches: [phase1/shared-library, main, fix/shared-lib-bugs]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Build Docker image
        run: docker build -t lab-linux .

      - name: Run unit tests (Units I-XI)
        run: |
          for u in i ii iii iv v vi vii viii ix x xi; do
            echo "=== Running tests for Unit $u ==="
            docker run --rm \
              -v $(pwd)/units/$u:/opt/lab-units/$u:ro \
              lab-linux \
              bash -c "bash /opt/lab-units/$u/test.sh" || exit 1
          done
        env:
          FRASE_OCULTA: "Toda revolución comienza con un pass. Los administradores nunca duermen."

      - name: Run shared/ scripts lint
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          for f in shared/*.sh; do
            echo "Checking $f..."
            bash -n "$f" || exit 1
            shellcheck "$f" || exit 1
          done

      - name: Verify menu.sh integration
        run: |
          docker run --rm lab-linux bash -c "source /shared/menu.sh && echo 'Menu OK'"

      - name: Verify entrypoint sources common (transitively menu)
        run: |
          grep -q "source /shared/common.sh" entrypoint.sh || {
            echo "ERROR: entrypoint.sh does not source common.sh"
            exit 1
          }
          grep -q "source.*menu.sh" shared/common.sh || {
            echo "ERROR: common.sh does not source menu.sh"
            exit 1
          }

      - name: Build and verify PDF generation
        run: |
          docker run --rm \
            -v $(pwd)/resultados:/home/estudiante/laboratorio/resultados \
            lab-linux \
            bash -c "mkdir -p /home/estudiante/laboratorio/resultados && bash /generar-pdf.sh 1"
