# =============================================================================
# Docker Compose - Laboratorio Ciberseguridad ABC-CYB-101
# =============================================================================
# Levanta el contenedor interactivo del laboratorio.
#
# Uso:
#   docker compose up -d          # Levantar en segundo plano
#   docker compose exec lab_fundamentos_cyber bash  # Entrar al contenedor
#   docker compose down           # Detener y eliminar
# =============================================================================

services:
  # ==========================================================================
  # Production profile (default, hardened)
  # ==========================================================================
  lab_fundamentos_cyber:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lab-ciberseguridad
    stdin_open: true
    tty: true
    read_only: true
    volumes:
      - lab-data:/home/estudiante/laboratorio
      - ./resultados:/home/estudiante/laboratorio/resultados
    tmpfs:
      - /tmp
      - /var/log/nginx
      - /var/lab-state
    environment:
      - LAB_NAME=Fundamentos de Ciberseguridad ABC-CYB-101
      - COURSE_VERSION=2.0
      - STUDENT_USER=estudiante
      - STUDENT_PASS=${STUDENT_PASS:-changeme}
      - FRASE_OCULTA=Toda revolution comienza con un pass Los administradores nunca duermen !
    networks:
      lab-cyber:
        ipv4_address: 172.20.0.10
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SETUID
      - SETGID

  # ==========================================================================
  # CI profile — relaxed hardening for privileged validators in CI/local test
  # Use: docker compose --profile ci up lab_fundamentos_cyber_ci
  #      docker compose -p ci up lab_fundamentos_cyber_ci  (Compose v1)
  # ==========================================================================
  lab_fundamentos_cyber_ci:
    profiles: ["ci"]
    container_name: lab-ciberseguridad-ci
    stdin_open: true
    tty: true
    read_only: false
    volumes:
      - lab-data:/home/estudiante/laboratorio
      - ./resultados:/home/estudiante/laboratorio/resultados
    environment:
      - LAB_NAME=Fundamentos de Ciberseguridad ABC-CYB-101
      - COURSE_VERSION=2.0
      - STUDENT_USER=estudiante
      - STUDENT_PASS=${STUDENT_PASS:-changeme}
      - FRASE_OCULTA=Toda revolution comienza con un pass Los administradores nunca duermen !
    networks:
      lab-cyber:
        ipv4_address: 172.20.0.10
    restart: unless-stopped
    security_opt:
      - no-new-privileges:false
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SETUID
      - SETGID

volumes:
  lab-data:
    driver: local

networks:
  lab-cyber:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
          gateway: 172.20.0.1
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
      com.docker.network.bridge.host_binding_ipv4: "127.0.0.1"
